# Cloud Build config for deploying as a GCP Cloud Run Job.
#
# Placeholders:
#   _PROJECT_ID      – your GCP project
#   _REGION          – e.g. us-central1
#   _IMAGE_NAME      – Container Registry image name
#   _JOB_NAME        – Cloud Run Job name
#   _SERVICE_ACCOUNT – SA with Secret Manager access (for GEMINI_API_KEY etc.)
#
# Usage:
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions=_PROJECT_ID=my-project,_REGION=us-central1,...

substitutions:
  _PROJECT_ID: 'REPLACE_WITH_PROJECT_ID'
  _REGION: 'REPLACE_WITH_REGION'
  _IMAGE_NAME: 'agent-arena-bot'
  _JOB_NAME: 'agent-arena-job'
  _SERVICE_ACCOUNT: 'REPLACE_WITH_SERVICE_ACCOUNT_EMAIL'

steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:${SHORT_SHA}'
      - '-f'
      - 'deploy/Dockerfile'
      - '.'

  # 2. Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:${SHORT_SHA}'

  # 3. Deploy / update Cloud Run Job
  # TODO: Add --set-secrets flags to inject GEMINI_API_KEY, EPHEMERAL_JWT,
  #       MCP_ENDPOINT from Secret Manager once they are provisioned.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_JOB_NAME}'
      - '--image'
      - 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'
      - '--task-timeout'
      - '3600s'
      - '--max-retries'
      - '1'

images:
  - 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:${SHORT_SHA}'
